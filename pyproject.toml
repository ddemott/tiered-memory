[project]
name = "tiered-memory"
version = "0.1.0"
description = "Portable short/medium/long-term memory tiers for LLM agents. Stdlib only, bring your own LLM."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dale DeMott" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
tiered_memory = ["schema.sql"]
